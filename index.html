":2,"correct_points_no_reveal":10,"correct_points_if_revealed":8,"left_option_role":"dominant","condition_code":"FA"},{"list_id":"L10","trial_order":18,"stimulus_id":"S013","target":"وجد","uncertainty_band":"lower uncertainty","pilot_entropy_bits":0,"pilot_dominance":1,"policy_condition":"free","intended_reading_role":"dominant","intended_reading":"وَجَد","competing_reading":"وُجِد","context_frame":"___ الباحث الحل أخيرا.","intended_meaning":"found (active verb)","grammatical_class":"active perfect verb","diagnostic_basis":"active subject–object frame","reveal_cost_points":2,"correct_points_no_reveal":10,"correct_points_if_revealed":8,"left_option_role":"alternative","condition_code":"FD"},{"list_id":"L10","trial_order":19,"stimulus_id":"S016","target":"فصل","uncertainty_band":"higher uncertainty","pilot_entropy_bits":0.7642045065086203,"pilot_dominance":0.7777777777777778,"policy_condition":"free","intended_reading_role":"dominant","intended_reading":"فَصْل","competing_reading":"فَصَل","context_frame":"بدأ ___ الشتاء مبكرا.","intended_meaning":"season (noun)","grammatical_class":"noun","diagnostic_basis":"construct-state noun frame","reveal_cost_points":2,"correct_points_no_reveal":10,"correct_points_if_revealed":8,"left_option_role":"alternative","condition_code":"FD"},{"list_id":"L10","trial_order":20,"stimulus_id":"S035","target":"درس","uncertainty_band":"higher uncertainty","pilot_entropy_bits":0.9709505944546686,"pilot_dominance":0.6,"policy_condition":"forced reveal","intended_reading_role":"alternative","intended_reading":"دَرَس","competing_reading":"دَرْس","context_frame":"___ الطالب النحو مساء.","intended_meaning":"studied (verb)","grammatical_class":"perfect verb","diagnostic_basis":"transitive subject–object frame","reveal_cost_points":0,"correct_points_no_reveal":10,"correct_points_if_revealed":10,"left_option_role":"dominant","condition_code":"RA"}],"manifest_sha256":"67fede471a1192b2951ef453338539eb7cbf82122765ff593a063c87f28ab7ff","practice":[{"list_ <script>
"use strict";
const DATA=JSON.parse(document.getElementById("data").textContent), stage=document.getElementById("stage");
const VERSION="1.2.2-online",BUILD_ID="confidence-0-100",LOCK_KEY="aimar_completed_submission_v1";
const SUBMISSION_URL="https://script.google.com/macros/s/AKfycbxp-7gDPHysIQDuvFv71mEUfQ757ekTllvq5ju3bEXb4uCwM1ky1GQ0UKUCQ7gAo1FQ1g/exec";
const RECEIPT_SOURCE="aimar-google-apps-script";
const state={phase:"setup",participant:"",age:null,gender:"",arabicMotherTongue:"",list:"",session:crypto.randomUUID(),mode:"practice",i:0,trials:[],responses:[],score:0,practiceCorrect:0,practiceAttempt:1,checks:0,draft:{},started:"",phaseAt:0,consent:false};
const qs=(s)=>document.querySelector(s), now=()=>performance.now(), iso=()=>new Date().toISOString(), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function roleReading(t,r){return t[r]|| (r==="dominant"?t.intended_reading_role==="dominant"?t.intended_reading:t.competing_reading:t.intended_reading_role==="alternative"?t.intended_reading:t.competing_reading)}
function sideRole(t,side){return side==="left"?t.left_option_role:(t.left_option_role==="dominant"?"alternative":"dominant")}
function entropy(p){if(p<=0||p>=1)return 0;return -(p*Math.log2(p)+(1-p)*Math.log2(1-p))}
function kl(q,p){const e=1e-9;q=Math.min(1-e,Math.max(e,q));p=Math.min(1-e,Math.max(e,p));return q*Math.log(q/p)+(1-q)*Math.log((1-q)/(1-p))}
function assignedList(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return "L"+String(h%10+1).padStart(2,"0")}
function card(x,cls=""){stage.innerHTML='<section class="card '+cls+'">'+x+"</section>";state.phaseAt=now();header()}
function header(){const main=state.mode==="main"&&!["setup","instructions","check","practice-intro","main-intro","practice-summary","complete"].includes(state.phase);qs("#counter").textContent=main?"التجربة "+(state.i+1)+" من 20":"";qs("#score").textContent=main?"النقاط: "+state.score:"";qs("#fill").style.width=main?((state.i+1)*5)+"%":"0"}
function backup(){localStorage.setItem("aimar_backup_"+state.session,JSON.stringify({participant:state.participant,age:state.age,gender:state.gender,arabic_mother_tongue:state.arabicMotherTongue,list:state.list,session:state.session,score:state.score,responses:state.responses,updated:iso()}))}
function setup(){state.phase="setup";const previous=localStorage.getItem(LOCK_KEY);if(previous){let completed="";try{completed=JSON.parse(previous).completed_at||""}catch{}card('<div class="eyebrow">تم تسجيل مشاركة سابقة</div><h1>لا يمكن إرسال استجابة ثانية من هذا المتصفح</h1><p class="lead">تسمح هذه الدراسة بمشاركة واحدة فقط. لقد اكتملت مشاركة سابقة'+(completed?" في "+new Date(completed).toLocaleString("ar"):"")+'.</p><div class="notice">إذا ظهرت هذه الرسالة بالخطأ، تواصل مع الباحث. لا تمسح بيانات المتصفح بغرض إعادة المشاركة.</div><details><summary>أدوات الباحث</summary><p class="quiet">يؤدي هذا إلى فتح نسخة اختبار جديدة على هذا المتصفح فقط، ولا يحذف أي استجابة سبق إرسالها إلى الباحث.</p><button id="reset-lock" class="secondary">إعادة ضبط قفل الاختبار</button></details>');qs("#reset-lock").onclick=()=>{const answer=prompt('للتأكيد، اكتب RESET بأحرف إنجليزية كبيرة:');if(answer==="RESET"){localStorage.removeItem(LOCK_KEY);location.replace(location.href.split("#")[0])}else if(answer!==null)alert("لم تتم إعادة الضبط. كلمة التأكيد غير صحيحة.")};return}card('<div class="eyebrow">دراسة سلوكية عن قراءة العربية</div><h1>كيف نستخدم السياق لفهم الكلمات غير المشكولة؟</h1><p class="lead">في هذه المهمة سترى كلمات عربية من دون حركات، وتختار القراءة التي تبدو لك أرجح. في بعض المحاولات يمكنك طلب جملة سياقية تساعدك، لكن طلبها يخصم 3 نقاط.</p><div class="notice"><strong>المشاركة طوعية.</strong><br>ستُسجَّل اختياراتك، وتقديرات يقينك، وأزمنة استجابتك، وقرارات طلب السياق، إضافةً إلى العمر والجنس وما إذا كانت العربية لغتك الأم، تحت رمز مجهّل. بعد إكمال المهمة، سترسل البيانات عبر اتصال مشفّر إلى جدول بيانات خاص بالباحث، ويجوز مشاركتها مع فريق البحث لتحليلها وعرض نتائج مجمعة. ستبقى نسخة احتياطية قابلة للتنزيل على جهازك. لا تُدخل اسمك أو أي معلومة تكشف هويتك. يمكنك الانسحاب قبل الإكمال بإغلاق الصفحة. يُسمح بمشاركة مكتملة واحدة فقط لكل متصفح وجهاز.</div><label class="field"><span>رمز المشارك المجهّل</span><input id="pid" dir="ltr" placeholder="مثال: P003" autocomplete="off"></label><div class="demographics"><label class="field"><span>العمر بالسنوات</span><input id="age" type="number" min="18" max="100" step="1" inputmode="numeric" placeholder="مثال: 30"></label><label class="field"><span>الجنس</span><select id="gender"><option value="">اختر</option><option value="female">أنثى</option><option value="male">ذكر</option><option value="other">آخر</option><option value="prefer_not_to_say">أفضل عدم الإجابة</option></select></label><label class="field"><span>هل العربية لغتك الأم؟</span><select id="arabic"><option value="">اختر</option><option value="yes">نعم</option><option value="no">لا</option></select></label></div><details><summary>إعدادات الباحث</summary><label class="field"><span>القائمة التجريبية</span><select id="list"><option value="">تعيين تلقائي</option>'+Array.from({length:10},(_,i)=>'<option>L'+String(i+1).padStart(2,"0")+"</option>").join("")+'</select></label></details><div class="consent"><label><input id="consent" type="checkbox"><span><strong>أوافق طوعًا على المشاركة في هذه المهمة، وعلى إرسال بيانات إجاباتي والبيانات الديموغرافية المجهّلة إلى الباحث واستخدامها ومشاركتها مع فريق البحث لأغراض التحليل العلمي.</strong></span></label></div><button id="begin" class="primary" disabled>قرأت المعلومات وأوافق — بدء التعليمات</button><div class="meta"><span>20 محاولة أساسية</span><span>نحو 12–15 دقيقة</span><span>العربية الفصحى</span></div>');
const pid=qs("#pid"),age=qs("#age"),gender=qs("#gender"),arabic=qs("#arabic"),consent=qs("#consent"),begin=qs("#begin");function ready(){const n=Number(age.value);begin.disabled=!(pid.value.trim()&&Number.isInteger(n)&&n>=18&&n<=100&&gender.value&&arabic.value&&consent.checked)}pid.oninput=ready;age.oninput=ready;gender.onchange=ready;arabic.onchange=ready;consent.onchange=ready;begin.onclick=()=>{if(localStorage.getItem(LOCK_KEY))return setup();state.participant=pid.value.trim();state.age=Number(age.value);state.gender=gender.value;state.arabicMotherTongue=arabic.value;state.consent=true;state.list=qs("#list").value||assignedList(state.participant);state.trials=DATA.rows.filter(t=>t.list_id===state.list).sort((a,b)=>a.trial_order-b.trial_order);if(state.trials.length!==20)return alert("القائمة غير مكتملة");state.started=iso();instructions()}}
function instructions(){state.phase="instructions";card('<div class="eyebrow">طريقة أداء المهمة</div><h1>ماذا ستفعل في كل محاولة؟</h1><div class="grid4"><div class="step"><b>1</b><h3>اختر القراءة الأولى</h3><p>سترى كلمة بلا حركات وخيارين مشكولين. اختر القراءة التي تبدو لك أرجح.</p></div><div class="step"><b>2</b><h3>حدّد مقدار يقينك</h3><p>حرّك المؤشر من اليمين إلى اليسار على مقياس من 0 إلى 100: الصفر يعني انعدام اليقين، و100 تعني اليقين التام.</p></div><div class="step"><b>3</b><h3>قرّر هل تحتاج إلى سياق</h3><p>في المحاولات الحرة، أجب مباشرة أو ادفع 3 نقاط لرؤية جملة تساعدك. في محاولات أخرى سيُحدَّد ذلك تلقائيًا.</p></div><div class="step"><b>4</b><h3>قدّم إجابتك النهائية</h3><p>اختر القراءة المقصودة بعد قرار السياق، ثم حدّد يقينك مرة أخرى.</p></div></div><h2>نظام النقاط في المحاولات الحرة</h2><div class="rules"><div class="rule"><strong>+10</strong>مطابقة من دون سياق</div><div class="rule"><strong>+7</strong>مطابقة بعد السياق (صافي النقاط)</div><div class="rule"><strong>0</strong>عدم مطابقة من دون سياق</div><div class="rule"><strong>−3</strong>عدم مطابقة بعد السياق</div></div><p class="quiet">تبدأ من صفر. سترى رصيدك الحالي وتغيّر النقاط بعد كل محاولة حرة. المحاولات المحددة تلقائيًا لا تغيّر الرصيد. لا توجد خسارة مالية، والنقاط ليست مالًا.</p><button id="go" class="primary">اختبار فهم قصير</button>');qs("#go").onclick=check}
function check(msg=""){state.phase="check";card('<div class="eyebrow">اختبار الفهم</div><h1>اختر الإجابات الصحيحة</h1><div class="question"><strong>كم يكلّف طلب السياق في المحاولة الحرة؟</strong>'+radio("cost",[["0","لا شيء"],["3","3 نقاط"],["10","10 نقاط"]])+'</div><div class="question"><strong>كيف يتحرك مقياس اليقين؟</strong>'+radio("dir",[["rtl","من 0 يمينًا إلى 100 يسارًا"],["ltr","من 0 يسارًا إلى 100 يمينًا"]])+'</div><div class="question"><strong>ماذا تعني موافقتك؟</strong>'+radio("use",[["yes","أوافق على المشاركة وتحليل بياناتي المجهّلة ومشاركتها مع فريق البحث"],["no","لا أوافق على استخدام البيانات"]])+'</div>'+(msg?'<p class="error">'+msg+"</p>":"")+'<button id="verify" class="primary">تحقق</button>',"narrow");qs("#verify").onclick=()=>{state.checks++;const ok=qs('input[name="cost"]:checked')?.value==="3"&&qs('input[name="dir"]:checked')?.value==="rtl"&&qs('input[name="use"]:checked')?.value==="yes";ok?practiceIntro():check("راجع التعليمات: تكلفة السياق 3 نقاط، ومقياس اليقين يمتد من 0 على اليمين إلى 100 على اليسار، والموافقة تشمل تحليل البيانات المجهّلة ومشاركتها مع فريق البحث.")}}
function radio(name,items){return items.map(([v,l])=>'<label class="radio"><input type="radio" name="'+name+'" value="'+v+'"><span>'+l+"</span></label>").join("")}
function practiceIntro(){state.phase="practice-intro";card('<div class="eyebrow">التدريب</div><h1>ثماني محاولات تدريبية</h1><p class="lead">سيظهر التصحيح في التدريب فقط. تحتاج إلى 6 إجابات صحيحة على الأقل. لا تؤثر نقاط التدريب في رصيد المهمة.</p><button id="pstart" class="primary">بدء التدريب</button>');qs("#pstart").onclick=()=>{state.mode="practice";state.i=0;state.practiceCorrect=0;startTrial()}}
function current(){return state.mode==="practice"?DATA.practice[state.i]:state.trials[state.i]}
function startTrial(){state.draft={timeout_flag:0,technical_error_flag:0};state.phase="fixation";stage.innerHTML='<div class="fix">+</div>';header();setTimeout(initialChoice,600)}
function options(t,fn){const l=sideRole(t,"left"),r=sideRole(t,"right");return '<div class="options"><button class="option" data-role="'+l+'">'+esc(roleReading(t,l))+'</button><button class="option" data-role="'+r+'">'+esc(roleReading(t,r))+"</button></div>"}
function bindOptions(fn){document.querySelectorAll(".option").forEach(b=>b.onclick=()=>fn(b.dataset.role))}
function initialChoice(){state.phase="initial-choice";const t=current();card('<div class="eyebrow">القراءة الأولى</div><p>اختر القراءة الأكثر احتمالًا</p><div class="target">'+esc(t.target)+"</div>"+options(t));bindOptions(r=>{state.draft.initial_choice_role=r;state.draft.initial_choice_rt_ms=Math.round(now()-state.phaseAt);confidence(false)})}
function confidence(final){state.phase=final?"final-confidence":"initial-confidence";const t=current(),role=final?state.draft.final_choice_role:state.draft.initial_choice_role;card('<div class="eyebrow">تقدير اليقين</div><h2>ما مدى يقينك بأن القراءة المقصودة هي:</h2><div class="chosen">'+esc(roleReading(t,role))+'</div><div id="cv" class="confval">50</div><input id="slider" class="slider" type="range" min="0" max="100" value="50" step="1"><div class="labels"><span class="hundred">يقين تام 100</span><span class="fifty">انعدام اليقين 0</span></div><button id="conf" class="primary" disabled>حرّك المؤشر للمتابعة</button>');const sl=qs("#slider"),btn=qs("#conf");sl.oninput=()=>{qs("#cv").textContent=sl.value;btn.disabled=false;btn.textContent="متابعة"};btn.onclick=()=>{state.draft[final?"final_confidence":"initial_confidence"]=+sl.value;final?finishOrFeedback():policy()}}
function policy(){state.phase="policy";const t=current();if(t.policy_condition==="free")card('<div class="eyebrow">قرار طلب المعلومات</div><h2>هل تجيب الآن أم تطلب جملة سياقية؟</h2><p class="quiet">طلب السياق يخصم 3 نقاط. رصيدك الحالي: <strong>'+state.score+'</strong></p><div class="policies"><button id="now" class="secondary"><span>الإجابة الآن</span><br><small>لا توجد تكلفة</small></button><button id="reveal" class="primary"><span>طلب السياق</span><br><small>−3 نقاط</small></button></div>');else if(t.policy_condition==="forced reveal")card('<div class="eyebrow">محاولة محددة تلقائيًا</div><h2>ستظهر الجملة السياقية في هذه المحاولة</h2><p class="quiet">لا تتغير نقاطك.</p><button id="reveal" class="primary">عرض السياق</button>');else card('<div class="eyebrow">محاولة محددة تلقائيًا</div><h2>لن تظهر جملة سياقية في هذه المحاولة</h2><p class="quiet">لا تتغير نقاطك.</p><button id="now" class="primary">متابعة</button>');const act=reveal=>{state.draft.reveal_choice=t.policy_condition==="free"?+reveal:null;state.draft.policy_rt_ms=Math.round(now()-state.phaseAt);state.draft.clue_shown=+reveal;reveal?clue():finalChoice()};if(qs("#now"))qs("#now").onclick=()=>act(false);if(qs("#reveal"))qs("#reveal").onclick=()=>act(true)}
function clue(){state.phase="clue";const t=current();card('<div class="eyebrow">السياق اللغوي</div>'+(t.policy_condition==="free"?'<div class="delta minus">−3</div><p class="quiet">تكلفة طلب السياق (تُحتسب في صافي نتيجة المحاولة)</p>':"")+'<h2>اقرأ الجملة بعناية</h2><div class="context">'+esc(t.context_frame)+'</div><p class="quiet">تشير ___ إلى موضع الكلمة.</p><button id="cont" class="primary" disabled>اقرأ السياق…</button>');const at=now();setTimeout(()=>{qs("#cont").disabled=false;qs("#cont").textContent="متابعة";qs("#cont").onclick=()=>{state.draft.clue_view_ms=Math.round(now()-at);finalChoice()}},1200)}
function finalChoice(){state.phase="final-choice";const t=current();card('<div class="eyebrow">الإجابة النهائية</div><p>اختر القراءة التي تعتقد أنها المقصودة الآن</p><div class="target">'+esc(t.target)+"</div>"+options(t));bindOptions(r=>{state.draft.final_choice_role=r;state.draft.final_choice_rt_ms=Math.round(now()-state.phaseAt);confidence(true)})}
function finishOrFeedback(){const t=current();if(t.practice){const match=state.draft.final_choice_role===t.intended_reading_role;if(match)state.practiceCorrect++;card('<div class="delta '+(match?"plus":"minus")+'">'+(match?"✓":"×")+'</div><h2>'+(match?"إجابة صحيحة":"الإجابة المقصودة هي")+'</h2><div class="chosen">'+esc(roleReading(t,t.intended_reading_role))+'</div><button id="next" class="primary">متابعة التدريب</button>');qs("#next").onclick=nextTrial}else finalize(t)}
function finalize(t){const d=state.draft,match=+(d.final_choice_role===t.intended_reading_role),free=t.policy_condition==="free",reveal=free&&d.reveal_choice===1;let delta=0;if(free)delta=match?(reveal?7:10):(reveal?-3:0);state.score+=delta;const initialChosenProbability=.5+.5*(d.initial_confidence/100),finalChosenProbability=.5+.5*(d.final_confidence/100),pi=d.initial_choice_role==="dominant"?initialChosenProbability:1-initialChosenProbability,pf=d.final_choice_role==="dominant"?finalChosenProbability:1-finalChosenProbability;state.responses.push({experiment_version:VERSION,build_id:BUILD_ID,manifest_sha256:DATA.manifest_sha256,session_id:state.session,participant_id:state.participant,age_years:state.age,gender:state.gender,arabic_mother_tongue:state.arabicMotherTongue,consent_participation:1,consent_deidentified_analysis_and_team_sharing:1,list_id:state.list,run_started_at:state.started,recorded_at:iso(),comprehension_attempts:state.checks,practice_attempts:state.practiceAttempt,trial_order:t.trial_order,stimulus_id:t.stimulus_id,target:t.target,uncertainty_band:t.uncertainty_band,pilot_entropy_bits:t.pilot_entropy_bits,pilot_dominance:t.pilot_dominance,policy_condition:t.policy_condition,condition_code:t.condition_code,intended_reading_role:t.intended_reading_role,intended_reading:t.intended_reading,competing_reading:t.competing_reading,left_option_role:t.left_option_role,initial_choice_role:d.initial_choice_role,initial_choice_rt_ms:d.initial_choice_rt_ms,initial_confidence:d.initial_confidence,p_initial_dominant:pi,initial_entropy_bits:entropy(pi),reveal_choice:free?d.reveal_choice:null,policy_rt_ms:d.policy_rt_ms,clue_shown:d.clue_shown,clue_view_ms:d.clue_view_ms??null,final_choice_role:d.final_choice_role,final_choice_rt_ms:d.final_choice_rt_ms,final_confidence:d.final_confidence,p_final_dominant:pf,choice_switch:+(d.initial_choice_role!==d.final_choice_role),match_assigned_reading:match,kl_final_initial:kl(pf,pi),timeout_flag:0,technical_error_flag:0,points_change:delta,cumulative_points:state.score});backup();state.phase="ack";card('<div class="eyebrow">تم تسجيل الإجابة</div>'+(free?'<div class="delta '+(delta<0?"minus":"plus")+'">'+(delta>0?"+":"")+delta+'</div><p class="quiet">تغيّر النقاط في هذه المحاولة</p><h2>الرصيد الحالي: '+state.score+'</h2>':'<h2>لا تتغير النقاط في المحاولات المحددة تلقائيًا</h2>'));setTimeout(nextTrial,1200)}
function nextTrial(){state.i++;const n=state.mode==="practice"?DATA.practice.length:state.trials.length;if(state.i<n)startTrial();else state.mode==="practice"?practiceSummary():complete()}
function practiceSummary(){state.phase="practice-summary";if(state.practiceCorrect>=6)card('<div class="eyebrow">نتيجة التدريب</div><div class="completeScore"><strong>'+state.practiceCorrect+'/8</strong></div><h1>اكتمل التدريب بنجاح</h1><button id="main" class="primary">متابعة إلى المهمة الأساسية</button>');else card('<div class="eyebrow">نتيجة التدريب</div><div class="completeScore"><strong>'+state.practiceCorrect+'/8</strong></div><h1>نحتاج إلى محاولة أخرى</h1><button id="again" class="primary">إعادة التدريب</button>');if(qs("#main"))qs("#main").onclick=mainIntro;if(qs("#again"))qs("#again").onclick=()=>{state.practiceAttempt++;state.i=0;state.practiceCorrect=0;startTrial()}}
function mainIntro(){state.phase="main-intro";card('<div class="eyebrow">المهمة الأساسية</div><h1>أصبحت جاهزًا</h1><p class="lead">ستبدأ الآن 20 محاولة. يبدأ رصيدك من صفر، ويظهر أعلى الشاشة. أجب بحسب حكمك، واطلب السياق فقط عندما ترى أن فائدته تستحق 3 نقاط.</p><button id="mainstart" class="primary">بدء المهمة</button>');qs("#mainstart").onclick=()=>{state.mode="main";state.i=0;state.score=0;startTrial()}}
function csv(v){if(v==null)return"";v=String(v);return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function download(format){const base="aimar_"+state.participant+"_"+state.list+"_"+state.session.slice(0,8);let content,type;if(format==="json"){content=JSON.stringify({session:{experiment_version:VERSION,build_id:BUILD_ID,session_id:state.session,participant_id:state.participant,age_years:state.age,gender:state.gender,arabic_mother_tongue:state.arabicMotherTongue,consent_participation:1,consent_deidentified_analysis_and_team_sharing:1,list_id:state.list,started_at:state.started,completed_at:iso(),total_points:state.score},responses:state.responses},null,2);type="application/json;charset=utf-8"}else{const h=Object.keys(state.responses[0]||{});content="\ufeff"+[h.map(csv).join(","),...state.responses.map(r=>h.map(k=>csv(r[k])).join(","))].join("\n");type="text/csv;charset=utf-8"}const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=base+"."+format;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},30000)}
function submissionPayload(){return{session:{experiment_version:VERSION,build_id:BUILD_ID,session_id:state.session,participant_id:state.participant,age_years:state.age,gender:state.gender,arabic_mother_tongue:state.arabicMotherTongue,consent_participation:1,consent_deidentified_analysis_and_team_sharing:1,list_id:state.list,started_at:state.started,completed_at:state.completedAt,total_points:state.score},responses:state.responses}}
function configured(){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(SUBMISSION_URL)}
function setSubmitStatus(message,type=""){const box=qs("#submit-status");if(box){box.className="submitStatus "+type;box.textContent=message}}
function submitResponses(){const button=qs("#submit");if(!configured()){setSubmitStatus("لم يُضبط رابط الإرسال بعد. نزّل ملف CSV وأرسله إلى الباحث.","error");return}button.disabled=true;setSubmitStatus("جارٍ إرسال الإجابات بأمان…");const nonce=crypto.randomUUID(),frame=document.createElement("iframe"),form=document.createElement("form"),payload=document.createElement("input"),nonceInput=document.createElement("input");frame.name="aimar-submit-"+nonce;frame.hidden=true;form.method="POST";form.action=SUBMISSION_URL;form.target=frame.name;form.hidden=true;payload.name="payload";payload.value=JSON.stringify(submissionPayload());nonceInput.name="nonce";nonceInput.value=nonce;form.append(payload,nonceInput);document.body.append(frame,form);let done=false;const cleanup=()=>{window.removeEventListener("message",receive);setTimeout(()=>{frame.remove();form.remove()},1000)};const fail=setTimeout(()=>{if(done)return;done=true;cleanup();button.disabled=false;setSubmitStatus("تعذّر تأكيد الإرسال. نزّل ملف CSV كنسخة احتياطية وحاول مرة أخرى عند توفر اتصال جيد.","error")},30000);function receive(event){const data=event.data;if(!data||data.source!==RECEIPT_SOURCE||data.nonce!==nonce||data.session_id!==state.session)return;done=true;clearTimeout(fail);cleanup();if(data.ok){localStorage.setItem("aimar_server_receipt_"+state.session,JSON.stringify({received_at:iso(),duplicate:!!data.duplicate}));button.disabled=true;button.textContent="تم إرسال الإجابات";setSubmitStatus(data.duplicate?"كانت هذه الاستجابة محفوظة مسبقًا، ولم تُضف نسخة مكررة.":"تم إرسال الإجابات وحفظها بنجاح. شكرًا لمشاركتك.","success")}else{button.disabled=false;setSubmitStatus("تعذّر حفظ الإجابات. نزّل ملف CSV كنسخة احتياطية ثم حاول مرة أخرى.","error")}}window.addEventListener("message",receive);form.submit()}
function complete(){state.phase="complete";state.completedAt=iso();localStorage.setItem(LOCK_KEY,JSON.stringify({session_id:state.session,participant_id:state.participant,completed_at:state.completedAt,experiment_version:VERSION}));backup();card('<div class="eyebrow">اكتملت المهمة</div><h1>شكرًا لمشاركتك</h1><div class="completeScore"><span>مجموع النقاط</span><strong>'+state.score+'</strong><small>بدأ الرصيد من صفر</small></div><p class="notice"><strong>تم تسجيل مشاركتك المكتملة وقفل إعادة المشاركة على هذا المتصفح.</strong><br>اضغط زر الإرسال مرة واحدة. احتفظ بملف CSV فقط إذا تعذّر الإرسال.</p><div class="submitActions"><button id="submit" class="primary">إرسال الإجابات إلى الباحث</button><div id="submit-status" class="submitStatus">يلزم اتصال بالإنترنت لإرسال الإجابات.</div></div><div class="downloads"><button id="csv" class="secondary">تنزيل نسخة CSV احتياطية</button><button id="json" class="secondary">تنزيل نسخة JSON احتياطية</button></div><div class="summary"><span>رمز المشارك: <b dir="ltr">'+esc(state.participant)+'</b></span><span>العمر: '+state.age+'</span><span>الجنس: '+esc(state.gender)+'</span><span>العربية لغة أم: '+esc(state.arabicMotherTongue)+'</span><span>القائمة: <b dir="ltr">'+state.list+'</b></span><span>المحاولات المسجلة: '+state.responses.length+'/20</span></div>');qs("#submit").onclick=submitResponses;qs("#csv").onclick=()=>download("csv");qs("#json").onclick=()=>download("json");if(localStorage.getItem("aimar_server_receipt_"+state.session)){qs("#submit").disabled=true;qs("#submit").textContent="تم إرسال الإجابات";setSubmitStatus("تم تأكيد حفظ هذه الاستجابة سابقًا.","success")}}
setup();
</script></body></html>
